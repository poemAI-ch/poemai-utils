name: Publish Tagged Release to PyPI

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install setuptools wheel
          python -m pip install -e .[testing]
          python -m pip install boto3 python-dateutil pytest-asyncio numpy tiktoken flake8

      - name: Check for unused imports
        run: flake8 --select=F401 --exclude="src/*/simple.py" src/

      - name: Run unit tests
        run: pytest tests/unit -v --tb=short

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate release tag and version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION.txt)"
          tag_version="${GITHUB_REF_NAME#v}"

          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "VERSION.txt must contain X.Y.Z, found: $version"
            exit 1
          }
          [[ "$version" == "$tag_version" ]] || {
            echo "Tag $GITHUB_REF_NAME does not match VERSION.txt ($version)."
            exit 1
          }

          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install build and validation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build distributions
        run: |
          rm -rf build dist
          python -m build

      - name: Check distributions
        run: python -m twine check dist/*

      - name: Upload tested distributions
        uses: actions/upload-artifact@v7
        with:
          name: poemai-utils-${{ steps.version.outputs.version }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Download tested distributions
        uses: actions/download-artifact@v8
        with:
          name: poemai-utils-${{ needs.build.outputs.version }}
          path: dist

      - name: Publish package
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist

      - name: Verify published version
        shell: bash
        env:
          RELEASE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          for attempt in {1..12}; do
            if python - "$RELEASE_VERSION" <<'PY'
          import json
          import sys
          import urllib.request

          expected = sys.argv[1]
          with urllib.request.urlopen(
              "https://pypi.org/pypi/poemai-utils/json", timeout=15
          ) as response:
              releases = json.load(response)["releases"]

          if not releases.get(expected):
              raise SystemExit(f"PyPI does not list poemai-utils=={expected}")
          PY
            then
              break
            fi

            if [[ "$attempt" == 12 ]]; then
              echo "Timed out waiting for poemai-utils==$RELEASE_VERSION on PyPI."
              exit 1
            fi
            sleep 10
          done

          python -m pip install --disable-pip-version-check --force-reinstall \
            --no-cache-dir --no-deps "poemai-utils==$RELEASE_VERSION"
          python - "$RELEASE_VERSION" <<'PY'
          import importlib.metadata
          import sys

          expected = sys.argv[1]
          installed = importlib.metadata.version("poemai-utils")
          assert installed == expected, (installed, expected)
          PY
