name: CI - Test and Build

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install setuptools wheel
          python -m pip install -e .[testing]
          python -m pip install boto3 python-dateutil pytest-asyncio numpy tiktoken flake8

      - name: Check for unused imports
        run: flake8 --select=F401 --exclude="src/*/simple.py" src/

      - name: Run unit tests
        run: pytest tests/unit -v --tb=short

  build:
    needs: test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate package version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION.txt)"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "VERSION.txt must contain X.Y.Z, found: $version"
            exit 1
          }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install build and validation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine

      - name: Build distributions
        run: |
          rm -rf build dist
          python -m build

      - name: Check distributions
        run: python -m twine check dist/*

      - name: Upload candidate distributions
        uses: actions/upload-artifact@v7
        with:
          name: poemai-utils-ci-${{ steps.version.outputs.version }}
          path: dist/*
          if-no-files-found: error
